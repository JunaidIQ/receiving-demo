<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Receiving Scanner</title>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="./receiving-data.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        #reader {
            width: 100%;
            margin-top: 20px;
        }

        /* iOS-only engine below. Android keeps the html5-qrcode #reader
           above, completely unchanged, since that's confirmed working.
           These are hidden unless the iOS branch actually runs. */
        #video {
            display: none;
            width: 100%;
            max-height: 420px;
            object-fit: contain;
            margin-top: 20px;
            border-radius: 8px;
            background: #000;
        }

        #startCameraButton,
        #stopCameraButton,
        #cameraSelect,
        #captureFrameButton {
            display: none;
        }

        #captureFrameButton {
            background: #555;
        }

        #debugFrame {
            display: none;
            width: 100%;
            margin-top: 10px;
            border-radius: 8px;
            border: 2px solid #8a2c2c;
        }

        #debugPanel {
            display: none;
            margin-top: 20px;
            max-height: 240px;
            overflow-y: auto;
            background: #111;
            color: #b6f2b6;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        #debugPanel .log-error {
            color: #ff9a9a;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #eee;
            border-radius: 8px;
            font-size: 20px;
            text-align: center;
        }

        .success {
            background: #dff5e1;
            color: #176b2c;
        }

        .error {
            background: #ffe0e0;
            color: #9b1c1c;
        }

        #weightSection {
            display: none;
            margin-top: 20px;
        }

        label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
        }

        button:disabled {
            background: #999;
        }

        #newScanButton {
            display: none;
            background: #555;
        }

        .info {
            margin-top: 10px;
            font-size: 15px;
            color: #666;
            text-align: center;
        }

        .field-info {
            margin-top: 5px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Receiving</h1>

    <p id="instructionText" style="text-align:center;">
        Scan the receiving barcode
    </p>

    <div id="reader"></div>

    <!-- iOS-only engine's UI. playsinline+muted are mandatory on iPhone:
         without them Safari refuses to play the stream inline. -->
    <video id="video" playsinline muted autoplay></video>

    <select id="cameraSelect"></select>

    <button id="startCameraButton" type="button">
        Start Camera
    </button>

    <button id="stopCameraButton" type="button">
        Stop Scanning
    </button>

    <button id="captureFrameButton" type="button">
        Capture Frame for Debug
    </button>

    <img id="debugFrame" alt="Last captured frame">

    <div class="result" id="resultBox">
        Scanned:
        <strong id="barcodeResult">Nothing yet</strong>
    </div>


    <!-- =========================================
         RECEIVING INFORMATION
         Hidden until barcode is scanned
         ========================================= -->

    <div id="weightSection">

        <label for="weightInput">
            Gross Weight (Lbs)
        </label>

        <input
            type="number"
            id="weightInput"
            inputmode="decimal"
            min="0"
            step="0.01"
            placeholder="Enter gross weight"
        >

        <label for="commoditySelect">
            Item / Commodity
        </label>

        <select id="commoditySelect"></select>

        <div class="field-info" id="commodityDefaultText">
            Default: Loading...
        </div>

        <label for="packagingSelect">
            Packaging
        </label>

        <select id="packagingSelect"></select>

        <div class="field-info">
            Tare automatically changes with packaging.
        </div>

        <label>
            Tare Weight
        </label>

        <input
            type="text"
            id="tareDisplay"
            value="70 Lbs"
            readonly
        >

        <label for="workflowSelect">
            Workflow Step
        </label>

        <select id="workflowSelect"></select>

        <div class="field-info" id="workflowDefaultText">
            Default: Loading...
        </div>

        <div class="info" id="receivingSummary">
            Tare: 70 Lbs
        </div>

        <button id="submitWeightButton">
            Submit Receiving
        </button>

    </div>


    <button id="newScanButton">
        Scan Another Inbound
    </button>

    <div id="debugPanel"></div>

</div>

<script>

    // =========================================
    // N8N WEBHOOK
    // =========================================

    const WEBHOOK_URL =
        "https://n8n.leadsking.ai/webhook/barcode-erp";


    // =========================================
    // DEBUG LOGGING (iOS engine only - Android's
    // html5-qrcode path below is untouched and
    // doesn't use this). Set to true while testing
    // on a device; the panel shows logs live with no
    // Mac needed. Commit as false for production.
    // =========================================

    const DEBUG = true;

    const debugPanel = document.getElementById("debugPanel");

    function stringifyLogArg(arg) {
        if (typeof arg === "string") return arg;
        if (arg instanceof Error) return arg.message;
        try {
            return JSON.stringify(arg);
        } catch {
            return String(arg);
        }
    }

    function renderLogLine(message, isError) {
        if (!DEBUG) return;
        const line = document.createElement("div");
        if (isError) line.className = "log-error";
        line.textContent = new Date().toLocaleTimeString() + "  " + message;
        debugPanel.prepend(line);
        while (debugPanel.childElementCount > 200) {
            debugPanel.lastElementChild.remove();
        }
    }

    function log(...args) {
        if (!DEBUG) return;
        console.log("[scanner]", ...args);
        renderLogLine(args.map(stringifyLogArg).join(" "));
    }

    function logError(...args) {
        if (!DEBUG) return;
        console.error("[scanner]", ...args);
        renderLogLine(args.map(stringifyLogArg).join(" "), true);
    }

    if (DEBUG) {
        debugPanel.style.display = "block";
        document.getElementById("captureFrameButton").style.display = "block";

        log("userAgent:", navigator.userAgent);
        log("isSecureContext:", window.isSecureContext, "protocol:", location.protocol);

        window.addEventListener("error", (event) => {
            logError("window error:", event.message, "@", event.filename + ":" + event.lineno);
        });

        window.addEventListener("unhandledrejection", (event) => {
            logError("unhandled rejection:", event.reason);
        });
    }


    // =========================================
    // FIXED / DEFAULT VALUES
    // =========================================

    const DEFAULT_COMMODITY_ID = 653;

    const DEFAULT_PACKAGING_ID = 19;

    const DEFAULT_TARE = 70;

    const DEFAULT_WORKFLOW_ID = 9;


    // =========================================
    // CURRENT BARCODE
    // =========================================

    let scannedBarcode = null;

    // Set by whichever engine (html5-qrcode or the iOS engine below)
    // actually starts, so onScanSuccess doesn't need to know which.
    let stopCurrentScanner = () => {};

    function getCommodityNameById(id) {
        const commodity = COMMODITIES.find(item => item.id === id);
        return commodity ? commodity.name : "Commodity";
    }

    function getPackagingNameById(id) {
        const packaging = PACKAGING_TYPES.find(item => item.id === id);
        return packaging ? packaging.name : "Packaging";
    }

    function getWorkflowNameById(id) {
        const workflow = WORKFLOW_STEPS.find(item => item.id === id);
        return workflow ? workflow.name : "Workflow";
    }

    function populateCommoditySelect() {
        const select = document.getElementById("commoditySelect");

        COMMODITIES.forEach((item) => {
            const option = document.createElement("option");
            option.value = item.id;
            option.textContent = item.name;

            if (item.id === RECEIVING_DEFAULTS.commodityId) {
                option.selected = true;
            }

            select.appendChild(option);
        });

        const defaultText = document.getElementById("commodityDefaultText");
        defaultText.textContent =
            "Default: " + getCommodityNameById(RECEIVING_DEFAULTS.commodityId);
    }

    function populatePackagingSelect() {
        const select = document.getElementById("packagingSelect");

        PACKAGING_TYPES.forEach((item) => {
            const option = document.createElement("option");
            option.value = item.id;
            option.dataset.tare = item.weight;
            option.textContent = item.name;

            if (item.id === RECEIVING_DEFAULTS.packagingTypeId) {
                option.selected = true;
            }

            select.appendChild(option);
        });
    }

    function populateWorkflowSelect() {
        const select = document.getElementById("workflowSelect");

        WORKFLOW_STEPS.forEach((item) => {
            const option = document.createElement("option");
            option.value = item.id;
            option.textContent = item.name;

            if (item.id === RECEIVING_DEFAULTS.workflowStepId) {
                option.selected = true;
            }

            select.appendChild(option);
        });

        const defaultText = document.getElementById("workflowDefaultText");
        defaultText.textContent =
            "Default: " + getWorkflowNameById(RECEIVING_DEFAULTS.workflowStepId);
    }

    function updateTareUI() {
        const packagingSelect = document.getElementById("packagingSelect");
        const selectedOption = packagingSelect.options[packagingSelect.selectedIndex];
        const tare = parseFloat(selectedOption?.dataset?.tare || 0);

        document.getElementById("tareDisplay").value = tare + " Lbs";
        document.getElementById("receivingSummary").innerText = "Tare: " + tare + " Lbs";
    }

    populateCommoditySelect();
    populatePackagingSelect();
    populateWorkflowSelect();
    updateTareUI();

    document.getElementById("packagingSelect")
        .addEventListener("change", updateTareUI);

    function onScanSuccess(decodedText) {
        log("onScanSuccess:", decodedText);

        if (scannedBarcode !== null) return;

        scannedBarcode = decodedText;
        document.getElementById("barcodeResult").innerText = decodedText;

        stopCurrentScanner();

        document.getElementById("instructionText").innerText = "Enter receiving information";

        const resultBox = document.getElementById("resultBox");
        resultBox.className = "result success";
        resultBox.innerHTML = `
            Inbound Scanned<br>
            <strong>${decodedText}</strong>
        `;

        document.getElementById("weightSection").style.display = "block";
        document.getElementById("weightInput").focus();
    }

    function onScanFailure() {
        // ignore
    }

    // =========================================
    // ENGINE: iOS only. All iOS browsers (Safari, and Chrome/Firefox for
    // iOS too, since Apple forces every one of them onto WebKit) lack a
    // native BarcodeDetector, so html5-qrcode falls back to a slow JS
    // decoder fed from a canvas capped at CSS-pixel size regardless of
    // camera resolution - real resolution loss on a dense 1D barcode.
    // "barcode-detector" polyfills the same detect() API with a WASM
    // (zxing-cpp) decoder that reads the <video> element at its native
    // resolution instead. Verified fixes folded in below:
    //  - plain facingMode first (no resolution hint) so iOS hands back its
    //    virtual, auto-focusing camera rather than a fixed-focus lens
    //    (https://github.com/ericblade/quagga2/discussions/504)
    //  - applyConstraints() afterwards to fix the low ~480x640 default
    //    resolution that same plain request gets on iOS, without
    //    triggering a fresh getUserMedia that could switch lenses
    //  - formats restricted to what these labels actually use (EAN_13/
    //    UPC_A false-positived against a real Code128 read in testing)
    //  - camera picker + iOS backgrounding recovery
    //    (https://bugs.webkit.org/show_bug.cgi?id=212040)
    // =========================================

    function isIOS() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    }

    function startIOSScanner() {
        document.getElementById("reader").style.display = "none";

        const video = document.getElementById("video");
        const startButton = document.getElementById("startCameraButton");
        const stopButton = document.getElementById("stopCameraButton");
        const cameraSelect = document.getElementById("cameraSelect");

        let detector = null;
        let stream = null;
        let timer = null;
        let busy = false;
        let selectedDeviceId = null;
        let cameraShouldBeActive = false;

        async function populateCameraList() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const cameras = devices.filter(d => d.kind === "videoinput");

                cameraSelect.innerHTML = "";
                cameras.forEach((camera, index) => {
                    const option = document.createElement("option");
                    option.value = camera.deviceId;
                    option.textContent = camera.label || ("Camera " + (index + 1));
                    cameraSelect.appendChild(option);
                });

                const activeDeviceId = stream?.getVideoTracks()[0]?.getSettings().deviceId;
                if (activeDeviceId) cameraSelect.value = activeDeviceId;

                cameraSelect.style.display = cameras.length > 1 ? "block" : "none";
                log("Cameras found:", cameras.length);
            } catch (error) {
                logError("enumerateDevices failed:", error);
            }
        }

        async function loadDetector() {
            if (detector) return true;
            try {
                const { BarcodeDetector } = await import(
                    "https://cdn.jsdelivr.net/npm/barcode-detector@3.2.2/dist/es/ponyfill.min.js"
                );
                // EAN_13/UPC_A re-added: excluding them fixed a false-positive
                // against a non-standard test pattern earlier, but it also
                // meant genuine EAN-13/UPC-A product barcodes (e.g. retail
                // packaging) could never match at all, regardless of image
                // quality - confirmed when a real, well-exposed EAN-13
                // capture correctly found "no barcode" only because this
                // format list didn't include it. Real barcodes validate via
                // checksum, so this shouldn't reintroduce that false-positive
                // risk the way it did against a non-conforming pattern.
                detector = new BarcodeDetector({
                    formats: ["code_128", "code_39", "ean_13", "upc_a", "qr_code"]
                });
                log("barcode-detector polyfill loaded");
                return true;
            } catch (error) {
                logError("Failed to load barcode-detector:", error);
                document.getElementById("instructionText").innerText =
                    "Scanner failed to load - check network";
                return false;
            }
        }

        function stopIOSScanner() {
            cameraShouldBeActive = false;
            if (timer !== null) { clearInterval(timer); timer = null; }
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            video.srcObject = null;
            video.style.display = "none";
            startButton.style.display = "none";
            stopButton.style.display = "none";
            cameraSelect.style.display = "none";
        }

        const exceptionCounts = {};

        async function scanFrame() {
            if (busy || !detector || !video.videoWidth) return;
            busy = true;
            try {
                const barcodes = await detector.detect(video);
                if (barcodes.length && barcodes[0].rawValue) {
                    log("Decoded:", barcodes[0].rawValue, "format=" + barcodes[0].format);
                    onScanSuccess(barcodes[0].rawValue);
                }
            } catch (error) {
                const type = error?.constructor?.name || "UnknownError";
                exceptionCounts[type] = (exceptionCounts[type] || 0) + 1;
                const count = exceptionCounts[type];
                if (count === 1 || count % 100 === 0) {
                    logError("Decode error (" + type + " x" + count + "):", error.message || error);
                }
            } finally {
                busy = false;
            }
        }

        async function startIOSCamera() {
            log("startIOSCamera() called, selectedDeviceId=" + selectedDeviceId);
            startButton.style.display = "none";
            video.style.display = "block";

            if (!window.isSecureContext || !navigator.mediaDevices) {
                logError("Camera needs HTTPS. secure=" + window.isSecureContext);
                document.getElementById("instructionText").innerText = "Camera needs HTTPS to run";
                return;
            }

            if (!(await loadDetector())) {
                startButton.style.display = "block";
                return;
            }

            if (selectedDeviceId) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { deviceId: { exact: selectedDeviceId } },
                        audio: false
                    });
                    log("Camera constraints accepted (selected device)");
                } catch (error) {
                    logError("Selected camera failed:", error);
                }
            }

            const attempts = [
                { facingMode: { ideal: "environment" } },
                { facingMode: { ideal: "environment" },
                  width: { ideal: 1920 }, height: { ideal: 1080 } },
                { facingMode: { ideal: "environment" },
                  width: { ideal: 1280 }, height: { ideal: 720 } }
            ];

            for (let index = 0; !stream && index < attempts.length; index++) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: attempts[index],
                        audio: false
                    });
                    log("Camera constraints accepted at attempt " + (index + 1));
                } catch (error) {
                    logError("Constraint attempt " + (index + 1) + " failed:", error);
                }
            }

            if (!stream) {
                logError("Camera failed: no constraint set accepted");
                startButton.style.display = "block";
                return;
            }

            try {
                video.srcObject = stream;
                await video.play();
                cameraShouldBeActive = true;

                const track = stream.getVideoTracks()[0];

                track.addEventListener("ended", () => {
                    if (!cameraShouldBeActive) return;
                    logError("Camera track ended unexpectedly - restarting");
                    stream = null;
                    startIOSCamera();
                });

                log("Camera started", track.getSettings());

                if (track.getSettings().width < 1280) {
                    try {
                        await track.applyConstraints({
                            width: { ideal: 1920 }, height: { ideal: 1080 }
                        });
                        log("Resolution upgraded:", track.getSettings());
                    } catch (error) {
                        logError("applyConstraints (resolution) failed:", error);
                    }
                }

                timer = setInterval(scanFrame, 200);
                stopButton.style.display = "block";
                await populateCameraList();
            } catch (error) {
                logError("Video playback failed:", error);
                startButton.style.display = "block";
            }
        }

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState !== "visible" || !cameraShouldBeActive) return;
            const track = stream?.getVideoTracks()[0];
            if (!track || track.readyState === "ended" || track.muted) {
                logError("Camera lost while backgrounded - restarting");
                stream?.getTracks().forEach(t => t.stop());
                stream = null;
                startIOSCamera();
            }
        });

        startButton.addEventListener("click", () => startIOSCamera());

        stopButton.addEventListener("click", () => {
            selectedDeviceId = null;
            stopIOSScanner();
            startButton.style.display = "block";
        });

        cameraSelect.addEventListener("change", () => {
            selectedDeviceId = cameraSelect.value;
            log("Camera manually switched to:", cameraSelect.selectedOptions[0]?.textContent);
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            startIOSCamera();
        });

        document.getElementById("captureFrameButton").addEventListener("click", async () => {
            if (!video.videoWidth) {
                logError("Capture failed: video not ready");
                return;
            }

            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext("2d").drawImage(video, 0, 0);

            const debugFrame = document.getElementById("debugFrame");
            debugFrame.style.display = "block";

            await new Promise(resolve => {
                debugFrame.onload = resolve;
                debugFrame.src = canvas.toDataURL("image/png");
            });

            log("Captured frame " + canvas.width + "x" + canvas.height);

            if (!(await loadDetector())) return;

            try {
                const barcodes = await detector.detect(debugFrame);
                if (barcodes.length) {
                    log("Single-frame decode SUCCESS:", barcodes[0].rawValue,
                        "format=" + barcodes[0].format);
                } else {
                    logError("Single-frame decode: no barcode found");
                }
            } catch (error) {
                logError("Single-frame decode error:", error.message || error);
            }
        });

        stopCurrentScanner = stopIOSScanner;

        log("Starting iOS engine");
        startIOSCamera();
    }

    if (isIOS()) {
        startIOSScanner();
    } else {
        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            {
                fps: 10,
                qrbox: { width: 300, height: 150 }
            },
            false
        );

        stopCurrentScanner = () => html5QrcodeScanner.clear();

        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    document.getElementById("submitWeightButton").addEventListener("click", function () {
        const weightInput = document.getElementById("weightInput");
        const weight = parseFloat(weightInput.value);

        const commoditySelect = document.getElementById("commoditySelect");
        const packagingSelect = document.getElementById("packagingSelect");
        const workflowSelect = document.getElementById("workflowSelect");

        if (!scannedBarcode) {
            alert("Please scan an inbound barcode first.");
            return;
        }

        if (!weight || weight <= 0) {
            alert("Please enter a valid gross weight.");
            weightInput.focus();
            return;
        }

        const commodityId = Number(commoditySelect.value);
        const packagingTypeId = Number(packagingSelect.value);
        const workflowStepId = Number(workflowSelect.value);

        const selectedPackaging = packagingSelect.options[packagingSelect.selectedIndex];
        const weightTare = parseFloat(selectedPackaging.dataset.tare || 0);

        if (weight < weightTare) {
            alert("Gross weight cannot be less than " + weightTare + " Lbs tare.");
            weightInput.focus();
            return;
        }

        const button = document.getElementById("submitWeightButton");
        button.disabled = true;
        button.innerText = "Submitting...";

        const resultBox = document.getElementById("resultBox");
        resultBox.className = "result";
        resultBox.innerHTML = `
            Sending receiving information...<br>
            <strong>${scannedBarcode}</strong>
        `;

        const receivingData = {
            barcode: scannedBarcode,
            weightReceived: weight,
            commodityId: commodityId,
            packagingTypeId: packagingTypeId,
            weightTare: weightTare,
            workflowStepId: workflowStepId
        };

        console.log("Sending to n8n:", receivingData);

        fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(receivingData)
        })
        .then(async response => {
            const text = await response.text();

            if (!response.ok) {
                throw new Error("n8n returned HTTP " + response.status + ": " + text);
            }

            if (!text) {
                return {};
            }

            try {
                return JSON.parse(text);
            } catch {
                return {};
            }
        })
        .then(data => {
            console.log("Receiving completed:", data);

            const netWeight = weight - weightTare;
            const commodityName = getCommodityNameById(commodityId);
            const packagingName = getPackagingNameById(packagingTypeId);
            const workflowName = getWorkflowNameById(workflowStepId);

            resultBox.className = "result success";

            resultBox.innerHTML = `
                <strong>Receiving Complete</strong>
                <br><br>

                Inbound:
                ${scannedBarcode}

                <br>

                Gross:
                ${weight.toFixed(2)} Lbs

                <br>

                Tare:
                ${weightTare.toFixed(2)} Lbs

                <br>

                Net:
                ${netWeight.toFixed(2)} Lbs

                <br>

                Item:
                ${commodityName}

                <br>

                Packaging:
                ${packagingName}

                <br>

                Workflow:
                ${workflowName}
            `;

            document.getElementById("weightSection").style.display = "none";
            document.getElementById("instructionText").innerText = "Receiving successfully submitted";
            document.getElementById("newScanButton").style.display = "block";
        })
        .catch(error => {
            console.error("Error submitting receiving:", error);

            resultBox.className = "result error";
            resultBox.innerHTML = `
                <strong>Submission Failed</strong>
                <br><br>

                ${scannedBarcode}

                <br><br>

                Please try again.
            `;

            button.disabled = false;
            button.innerText = "Submit Receiving";
        });
    });

    document.getElementById("newScanButton").addEventListener("click", function () {
        location.reload();
    });
</script>
