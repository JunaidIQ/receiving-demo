<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Receiving Scanner</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        #reader {
            width: 100%;
            margin-top: 20px;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #eee;
            border-radius: 8px;
            font-size: 20px;
            text-align: center;
        }

        .success {
            background: #dff5e1;
            color: #176b2c;
        }

        .error {
            background: #ffe0e0;
            color: #9b1c1c;
        }

        #weightSection {
            display: none;
            margin-top: 20px;
        }

        label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
        }

        button:disabled {
            background: #999;
        }

        #newScanButton {
            display: none;
            background: #555;
        }

        .info {
            margin-top: 10px;
            font-size: 15px;
            color: #666;
            text-align: center;
        }

        .field-info {
            margin-top: 5px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Receiving</h1>

    <p id="instructionText" style="text-align:center;">
        Scan the receiving barcode
    </p>

    <div id="reader"></div>

    <div class="result" id="resultBox">
        Scanned:
        <strong id="barcodeResult">Nothing yet</strong>
    </div>


    <!-- =========================================
         RECEIVING INFORMATION
         Hidden until barcode is scanned
         ========================================= -->

    <div id="weightSection">

        <!-- GROSS WEIGHT -->

        <label for="weightInput">
            Gross Weight (Lbs)
        </label>

        <input
            type="number"
            id="weightInput"
            inputmode="decimal"
            min="0"
            step="0.01"
            placeholder="Enter gross weight"
        >


        <!-- COMMODITY -->

        <label for="commoditySelect">
            Item / Commodity
        </label>

        <select id="commoditySelect">

            <!-- DEFAULT -->
            <option value="653" selected>
                Mix Electronics
            </option>

            <!-- ADD YOUR OTHER COMMODITIES HERE -->

            <option value="YOUR_ID_1">
                Commodity 1
            </option>

            <option value="YOUR_ID_2">
                Commodity 2
            </option>

            <option value="YOUR_ID_3">
                Commodity 3
            </option>

        </select>

        <div class="field-info">
            Default: Mix Electronics
        </div>


        <!-- PACKAGING -->

        <label for="packagingSelect">
            Packaging
        </label>

        <select id="packagingSelect">

            <!-- DEFAULT -->
            <option
                value="19"
                data-tare="70"
                selected
            >
                Gaylord
            </option>

            <option
                value="18"
                data-tare="45"
            >
                Pallet
            </option>

            <option
                value="20"
                data-tare="0"
            >
                Unit
            </option>

            <option
                value="21"
                data-tare="0"
            >
                Box
            </option>

            <option
                value="22"
                data-tare="0"
            >
                Loose
            </option>

            <option
                value="23"
                data-tare="180"
            >
                Cage
            </option>

            <option
                value="24"
                data-tare="32200"
            >
                40 yard roll-off container
            </option>

            <option
                value="25"
                data-tare="140"
            >
                Double Gaylord
            </option>

        </select>

        <div class="field-info">
            Tare automatically changes with packaging.
        </div>


        <!-- TARE DISPLAY -->

        <label>
            Tare Weight
        </label>

        <input
            type="text"
            id="tareDisplay"
            value="70 Lbs"
            readonly
        >


        <!-- WORKFLOW -->

        <label for="workflowSelect">
            Workflow Step
        </label>

        <select id="workflowSelect">

            <option value="10">
                Audit
            </option>

            <!-- DEFAULT -->
            <option value="9" selected>
                Consumed
            </option>

            <option value="3">
                Data Destruction
            </option>

            <option value="14">
                Dismantle
            </option>

            <option value="4">
                Final
            </option>

            <option value="13">
                Finished Goods - Ready for Shipment
            </option>

            <option value="11">
                ITAD
            </option>

            <option value="8">
                Processed
            </option>

            <option value="20">
                Processed &amp; Audit
            </option>

            <option value="18">
                Scrap
            </option>

            <option value="1">
                Sort
            </option>

            <option value="5">
                Testing
            </option>

            <option value="16">
                Work in progress
            </option>

        </select>

        <div class="field-info">
            Default: Consumed
        </div>


        <!-- SUMMARY -->

        <div class="info" id="receivingSummary">
            Tare: 70 Lbs
        </div>


        <!-- SUBMIT -->

        <button id="submitWeightButton">
            Submit Receiving
        </button>

    </div>


    <button id="newScanButton">
        Scan Another Inbound
    </button>

</div>


<script>

    // =========================================
    // N8N WEBHOOK
    // =========================================

    const WEBHOOK_URL =
        "https://n8n.leadsking.ai/webhook/barcode-erp";


    // =========================================
    // FIXED / DEFAULT VALUES
    // =========================================

    const DEFAULT_COMMODITY_ID = 653;

    const DEFAULT_PACKAGING_ID = 19;

    const DEFAULT_TARE = 70;

    const DEFAULT_WORKFLOW_ID = 9;


    // =========================================
    // CURRENT BARCODE
    // =========================================

    let scannedBarcode = null;


    // =========================================
    // BARCODE SCAN SUCCESS
    // =========================================

    function onScanSuccess(decodedText, decodedResult) {

        console.log("Barcode detected:", decodedText);


        // Prevent duplicate scans
        if (scannedBarcode !== null) {
            return;
        }


        // Store barcode
        scannedBarcode = decodedText;


        // Show barcode
        document.getElementById(
            "barcodeResult"
        ).innerText = decodedText;


        // Stop scanner
        html5QrcodeScanner.clear();


        // Update instruction
        document.getElementById(
            "instructionText"
        ).innerText =
            "Enter receiving information";


        // Update result
        const resultBox =
            document.getElementById("resultBox");

        resultBox.className = "result success";

        resultBox.innerHTML = `
            Inbound Scanned<br>
            <strong>${decodedText}</strong>
        `;


        // Show receiving fields
        document.getElementById(
            "weightSection"
        ).style.display = "block";


        // Focus weight
        document.getElementById(
            "weightInput"
        ).focus();

    }


    // =========================================
    // BARCODE SCAN FAILURE
    // =========================================

    function onScanFailure(error) {

        // Ignore normal scan failures

    }


    // =========================================
    // CREATE SCANNER
    // =========================================

    const html5QrcodeScanner =
        new Html5QrcodeScanner(
            "reader",
            {
                fps: 10,

                qrbox: {
                    width: 300,
                    height: 150
                }
            },
            false
        );


    // Start scanner
    html5QrcodeScanner.render(
        onScanSuccess,
        onScanFailure
    );


    // =========================================
    // PACKAGING CHANGE
    // Automatically update tare
    // =========================================

    document
        .getElementById("packagingSelect")
        .addEventListener("change", function() {

            const selectedOption =
                this.options[this.selectedIndex];


            // Get packaging tare
            const tare =
                parseFloat(
                    selectedOption.dataset.tare
                );


            // Update tare display
            document.getElementById(
                "tareDisplay"
            ).value =
                tare + " Lbs";


            // Update summary
            document.getElementById(
                "receivingSummary"
            ).innerText =
                "Tare: " + tare + " Lbs";

        });


    // =========================================
    // SUBMIT RECEIVING
    // =========================================

    document
        .getElementById("submitWeightButton")
        .addEventListener("click", function() {


            // -------------------------------------
            // GET VALUES
            // -------------------------------------

            const weightInput =
                document.getElementById(
                    "weightInput"
                );


            const weight =
                parseFloat(weightInput.value);


            const commoditySelect =
                document.getElementById(
                    "commoditySelect"
                );


            const packagingSelect =
                document.getElementById(
                    "packagingSelect"
                );


            const workflowSelect =
                document.getElementById(
                    "workflowSelect"
                );


            // -------------------------------------
            // VALIDATE BARCODE
            // -------------------------------------

            if (!scannedBarcode) {

                alert(
                    "Please scan an inbound barcode first."
                );

                return;

            }


            // -------------------------------------
            // VALIDATE WEIGHT
            // -------------------------------------

            if (!weight || weight <= 0) {

                alert(
                    "Please enter a valid gross weight."
                );

                weightInput.focus();

                return;

            }


            // -------------------------------------
            // GET SELECTED VALUES
            // -------------------------------------

            const commodityId =
                parseInt(
                    commoditySelect.value
                );


            const packagingTypeId =
                parseInt(
                    packagingSelect.value
                );


            const workflowStepId =
                parseInt(
                    workflowSelect.value
                );


            const selectedPackaging =
                packagingSelect
                    .options[
                        packagingSelect.selectedIndex
                    ];


            const weightTare =
                parseFloat(
                    selectedPackaging.dataset.tare
                );


            // -------------------------------------
            // VALIDATE NET WEIGHT
            // -------------------------------------

            if (weight < weightTare) {

                alert(
                    "Gross weight cannot be less than " +
                    weightTare +
                    " Lbs tare."
                );

                weightInput.focus();

                return;

            }


            // -------------------------------------
            // SUBMIT BUTTON
            // -------------------------------------

            const button =
                document.getElementById(
                    "submitWeightButton"
                );


            button.disabled = true;

            button.innerText =
                "Submitting...";


            // -------------------------------------
            // SCREEN MESSAGE
            // -------------------------------------

            const resultBox =
                document.getElementById(
                    "resultBox"
                );


            resultBox.className =
                "result";


            resultBox.innerHTML = `
                Sending receiving information...<br>
                <strong>${scannedBarcode}</strong>
            `;


            // =====================================
            // SEND EVERYTHING TO N8N
            // =====================================

            const receivingData = {

                barcode: scannedBarcode,

                weightReceived: weight,

                commodityId: commodityId,

                packagingTypeId: packagingTypeId,

                weightTare: weightTare,

                workflowStepId: workflowStepId

            };


            console.log(
                "Sending to n8n:",
                receivingData
            );


            fetch(WEBHOOK_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(
                    receivingData
                )

            })


            // =====================================
            // WEBHOOK RESPONSE
            // =====================================

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "n8n returned HTTP " +
                        response.status
                    );

                }

                return response.json();

            })


            // =====================================
            // SUCCESS
            // =====================================

            .then(data => {

                console.log(
                    "Receiving completed:",
                    data
                );


                const netWeight =
                    weight - weightTare;


                resultBox.className =
                    "result success";


                resultBox.innerHTML = `
                    <strong>Receiving Complete</strong>
                    <br><br>

                    Inbound:
                    ${scannedBarcode}

                    <br>

                    Gross:
                    ${weight.toFixed(2)} Lbs

                    <br>

                    Tare:
                    ${weightTare.toFixed(2)} Lbs

                    <br>

                    Net:
                    ${netWeight.toFixed(2)} Lbs
                `;


                // Hide receiving form
                document.getElementById(
                    "weightSection"
                ).style.display = "none";


                // Update instruction
                document.getElementById(
                    "instructionText"
                ).innerText =
                    "Receiving successfully submitted";


                // Show new scan
                document.getElementById(
                    "newScanButton"
                ).style.display = "block";

            })


            // =====================================
            // ERROR
            // =====================================

            .catch(error => {

                console.error(
                    "Error submitting receiving:",
                    error
                );


                resultBox.className =
                    "result error";


                resultBox.innerHTML = `
                    <strong>Submission Failed</strong>
                    <br><br>

                    ${scannedBarcode}

                    <br><br>

                    Please try again.
                `;


                button.disabled = false;

                button.innerText =
                    "Submit Receiving";

            });

        });


    // =========================================
    // NEW SCAN
    // =========================================

    document
        .getElementById("newScanButton")
        .addEventListener("click", function() {

            location.reload();

        });

</script>

</body>
</html>
