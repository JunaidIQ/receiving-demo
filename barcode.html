<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Receiving Scanner</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
        }

        #reader {
            width: 100%;
            margin-top: 20px;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #eee;
            border-radius: 8px;
            font-size: 20px;
            text-align: center;
        }

        .success {
            background: #dff5e1;
            color: #176b2c;
        }

        .error {
            background: #ffe0e0;
            color: #9b1c1c;
        }

        #receivingSection {
            display: none;
            margin-top: 20px;
        }

        .field {
            margin-top: 18px;
        }

        label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
        }

        #weightInput {
            font-size: 22px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 18px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #newScanButton {
            display: none;
            background: #555;
        }

        .info {
            margin-top: 8px;
            font-size: 15px;
            color: #666;
        }

        .net-display {
            margin-top: 10px;
            padding: 12px;
            background: #f1f1f1;
            border-radius: 8px;
            font-size: 17px;
        }

        .section-title {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Receiving</h1>

    <p id="instructionText" style="text-align:center;">
        Scan the receiving barcode
    </p>

    <div id="reader"></div>

    <div class="result" id="resultBox">
        Scanned:
        <strong id="barcodeResult">Nothing yet</strong>
    </div>


    <!--
        Everything below this section remains hidden
        until a barcode has been successfully scanned.
    -->
    <div id="receivingSection">

        <div class="section-title">
            Receiving Details
        </div>


        <!-- ========================= -->
        <!-- GROSS WEIGHT -->
        <!-- ========================= -->

        <div class="field">

            <label for="weightInput">
                Gross Weight (Lbs)
            </label>

            <input
                type="number"
                id="weightInput"
                inputmode="decimal"
                min="0"
                step="0.01"
                placeholder="Enter gross weight"
            >

        </div>


        <!-- ========================= -->
        <!-- ITEM / COMMODITY -->
        <!-- ========================= -->

        <div class="field">

            <label for="commoditySelect">
                Item
            </label>

            <select id="commoditySelect">

                <!--
                    Default selection.
                    Mix Electronics = ID 653
                -->

                <option value="653" selected>
                    Mix Electronics
                </option>

                <!--
                    ADD THE REST OF YOUR 312 COMMODITIES HERE.
                    
                    Example:
                    
                    <option value="123">Commodity Name</option>
                    
                    The value MUST be the Razor commodity ID.
                -->

                <option value="623">AUDIO SYSTEM</option>
                <option value="518">Backage wire copper</option>
                <option value="432">Bag - Laptop</option>
                <option value="3">Bags - SCRAP</option>
                <option value="449">Ballasts</option>
                <option value="495">BAR CODE SCANNER</option>

            </select>

            <div class="info">
                Default: Mix Electronics
            </div>

        </div>


        <!-- ========================= -->
        <!-- PACKAGING -->
        <!-- ========================= -->

        <div class="field">

            <label for="packagingSelect">
                Packaging
            </label>

            <select id="packagingSelect">

                <!-- Default = Gaylord -->
                <option
                    value="19"
                    data-tare="70"
                    selected
                >
                    Gaylord
                </option>

                <option
                    value="18"
                    data-tare="45"
                >
                    Pallet
                </option>

                <option
                    value="20"
                    data-tare="0"
                >
                    Unit
                </option>

                <option
                    value="21"
                    data-tare="0"
                >
                    Box
                </option>

                <option
                    value="22"
                    data-tare="0"
                >
                    Loose
                </option>

                <option
                    value="23"
                    data-tare="180"
                >
                    Cage
                </option>

                <option
                    value="24"
                    data-tare="32200"
                >
                    40 yard roll-off container
                </option>

                <option
                    value="25"
                    data-tare="140"
                >
                    Double Gaylord
                </option>

            </select>

        </div>


        <!-- ========================= -->
        <!-- TARE -->
        <!-- ========================= -->

        <div class="field">

            <label for="tareInput">
                Tare (Lbs)
            </label>

            <input
                type="number"
                id="tareInput"
                value="70"
                readonly
            >

            <div class="info">
                Tare is automatically determined by packaging.
            </div>

        </div>


        <!-- ========================= -->
        <!-- NET WEIGHT PREVIEW -->
        <!-- ========================= -->

        <div class="net-display">

            Net Weight:
            <strong id="netWeightDisplay">
                0.00 Lbs
            </strong>

        </div>


        <!-- ========================= -->
        <!-- SUBMIT -->
        <!-- ========================= -->

        <button id="submitReceivingButton">
            Submit Receiving
        </button>

    </div>


    <!-- ========================= -->
    <!-- NEW SCAN -->
    <!-- ========================= -->

    <button id="newScanButton">
        Scan Another Inbound
    </button>

</div>


<script>


    // =====================================================
    // N8N WEBHOOK
    // =====================================================

    const WEBHOOK_URL =
        "https://n8n.leadsking.ai/webhook/barcode-erp";


    // =====================================================
    // STATE
    // =====================================================

    let scannedBarcode = null;

    let html5QrcodeScanner = null;


    // =====================================================
    // DOM ELEMENTS
    // =====================================================

    const resultBox =
        document.getElementById("resultBox");

    const barcodeResult =
        document.getElementById("barcodeResult");

    const receivingSection =
        document.getElementById("receivingSection");

    const weightInput =
        document.getElementById("weightInput");

    const commoditySelect =
        document.getElementById("commoditySelect");

    const packagingSelect =
        document.getElementById("packagingSelect");

    const tareInput =
        document.getElementById("tareInput");

    const netWeightDisplay =
        document.getElementById("netWeightDisplay");

    const submitReceivingButton =
        document.getElementById("submitReceivingButton");

    const newScanButton =
        document.getElementById("newScanButton");

    const instructionText =
        document.getElementById("instructionText");


    // =====================================================
    // UPDATE TARE FROM PACKAGING
    // =====================================================

    function updateTare() {

        const selectedOption =
            packagingSelect.options[
                packagingSelect.selectedIndex
            ];

        const tare =
            parseFloat(
                selectedOption.dataset.tare
            );


        tareInput.value = tare;


        updateNetWeight();

    }


    // =====================================================
    // UPDATE NET WEIGHT
    // =====================================================

    function updateNetWeight() {

        const gross =
            parseFloat(weightInput.value);

        const tare =
            parseFloat(tareInput.value);


        if (
            isNaN(gross) ||
            isNaN(tare)
        ) {

            netWeightDisplay.innerText =
                "0.00 Lbs";

            return;
        }


        const net =
            gross - tare;


        if (net < 0) {

            netWeightDisplay.innerText =
                "Invalid weight";

            return;
        }


        netWeightDisplay.innerText =
            net.toFixed(2) + " Lbs";

    }


    // =====================================================
    // PACKAGING CHANGED
    // =====================================================

    packagingSelect.addEventListener(
        "change",
        function() {

            updateTare();

        }
    );


    // =====================================================
    // WEIGHT CHANGED
    // =====================================================

    weightInput.addEventListener(
        "input",
        function() {

            updateNetWeight();

        }
    );


    // =====================================================
    // BARCODE SUCCESS
    // =====================================================

    function onScanSuccess(
        decodedText,
        decodedResult
    ) {

        console.log(
            "Barcode detected:",
            decodedText
        );


        // Prevent duplicate scans.
        if (scannedBarcode !== null) {
            return;
        }


        // Store barcode.
        scannedBarcode = decodedText;


        // Show barcode.
        barcodeResult.innerText =
            decodedText;


        // Stop scanner.
        if (html5QrcodeScanner) {

            html5QrcodeScanner.clear()
                .catch(error => {

                    console.log(
                        "Scanner clear:",
                        error
                    );

                });

        }


        // Update result.
        resultBox.className =
            "result success";


        resultBox.innerHTML = `
            <strong>Inbound Scanned</strong>
            <br><br>
            ${decodedText}
        `;


        // Update instructions.
        instructionText.innerText =
            "Enter receiving details";


        // Show receiving fields.
        receivingSection.style.display =
            "block";


        // Make sure defaults are correct.
        commoditySelect.value =
            "653";

        packagingSelect.value =
            "19";


        updateTare();


        // Focus weight field.
        setTimeout(
            function() {

                weightInput.focus();

            },
            300
        );

    }


    // =====================================================
    // BARCODE FAILURE
    // =====================================================

    function onScanFailure(error) {

        // Ignore normal scanner failures.

    }


    // =====================================================
    // CREATE SCANNER
    // =====================================================

    html5QrcodeScanner =
        new Html5QrcodeScanner(
            "reader",
            {
                fps: 10,

                qrbox: {
                    width: 300,
                    height: 150
                }
            },
            false
        );


    // Start scanner.
    html5QrcodeScanner.render(
        onScanSuccess,
        onScanFailure
    );


    // =====================================================
    // SUBMIT RECEIVING
    // =====================================================

    submitReceivingButton.addEventListener(
        "click",
        function() {


            // ---------------------------------------------
            // Validate barcode
            // ---------------------------------------------

            if (!scannedBarcode) {

                alert(
                    "Please scan an inbound barcode first."
                );

                return;

            }


            // ---------------------------------------------
            // Get weight
            // ---------------------------------------------

            const grossWeight =
                parseFloat(
                    weightInput.value
                );


            // ---------------------------------------------
            // Get tare
            // ---------------------------------------------

            const tare =
                parseFloat(
                    tareInput.value
                );


            // ---------------------------------------------
            // Get commodity
            // ---------------------------------------------

            const commodityId =
                parseInt(
                    commoditySelect.value
                );


            // ---------------------------------------------
            // Get packaging
            // ---------------------------------------------

            const packagingTypeId =
                parseInt(
                    packagingSelect.value
                );


            // ---------------------------------------------
            // Validate weight
            // ---------------------------------------------

            if (
                isNaN(grossWeight) ||
                grossWeight <= 0
            ) {

                alert(
                    "Please enter a valid gross weight."
                );

                weightInput.focus();

                return;

            }


            // ---------------------------------------------
            // Validate net weight
            // ---------------------------------------------

            if (
                grossWeight < tare
            ) {

                alert(
                    "Gross weight cannot be less than " +
                    tare +
                    " Lbs tare."
                );

                weightInput.focus();

                return;

            }


            // ---------------------------------------------
            // Prevent double submission
            // ---------------------------------------------

            submitReceivingButton.disabled =
                true;

            submitReceivingButton.innerText =
                "Submitting...";


            // ---------------------------------------------
            // Calculate net
            // ---------------------------------------------

            const netWeight =
                grossWeight - tare;


            // ---------------------------------------------
            // Update screen
            // ---------------------------------------------

            resultBox.className =
                "result";


            resultBox.innerHTML = `
                Sending receiving information...
                <br><br>
                <strong>${scannedBarcode}</strong>
            `;


            // =================================================
            // FINAL WEBHOOK REQUEST
            // =================================================
            //
            // This is the ONLY webhook request.
            //
            // n8n receives:
            //
            // barcode
            // weightReceived
            // commodityId
            // packagingTypeId
            // weightTare
            //
            // =================================================

            fetch(
                WEBHOOK_URL,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        barcode:
                            scannedBarcode,

                        weightReceived:
                            grossWeight,

                        commodityId:
                            commodityId,

                        packagingTypeId:
                            packagingTypeId,

                        weightTare:
                            tare

                    })

                }
            )


            // =================================================
            // RESPONSE
            // =================================================

            .then(
                response => {

                    if (!response.ok) {

                        throw new Error(
                            "n8n returned HTTP " +
                            response.status
                        );

                    }

                    return response.json();

                }
            )


            // =================================================
            // SUCCESS
            // =================================================

            .then(
                data => {

                    console.log(
                        "Receiving completed:",
                        data
                    );


                    resultBox.className =
                        "result success";


                    resultBox.innerHTML = `
                        <strong>Receiving Complete</strong>
                        <br><br>

                        Inbound:
                        ${scannedBarcode}

                        <br>

                        Gross:
                        ${grossWeight.toFixed(2)}
                        Lbs

                        <br>

                        Tare:
                        ${tare.toFixed(2)}
                        Lbs

                        <br>

                        Net:
                        ${netWeight.toFixed(2)}
                        Lbs
                    `;


                    // Hide receiving form.
                    receivingSection.style.display =
                        "none";


                    // Update instruction.
                    instructionText.innerText =
                        "Receiving successfully submitted";


                    // Show new scan.
                    newScanButton.style.display =
                        "block";


                }
            )


            // =================================================
            // ERROR
            // =================================================

            .catch(
                error => {

                    console.error(
                        "Error submitting receiving:",
                        error
                    );


                    resultBox.className =
                        "result error";


                    resultBox.innerHTML = `
                        <strong>Submission Failed</strong>
                        <br><br>

                        ${scannedBarcode}

                        <br><br>

                        Please try again.
                    `;


                    submitReceivingButton.disabled =
                        false;


                    submitReceivingButton.innerText =
                        "Submit Receiving";

                }
            );

        }
    );


    // =====================================================
    // NEW SCAN
    // =====================================================

    newScanButton.addEventListener(
        "click",
        function() {

            location.reload();

        }
    );


    // =====================================================
    // INITIAL DEFAULTS
    // =====================================================

    updateTare();

</script>

</body>
</html>
